name: Generate Project Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/gen-cards.mjs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-cards.mjs
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add assets/cards
          git commit -m "Update project cards" || exit 0
          git push
